<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff4d8d">
<title>Para mi amor ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Quicksand',system-ui,sans-serif;
    background:radial-gradient(circle at 30% 20%,#ffd1e3 0%,#ff8fb8 45%,#e0457b 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    min-height:100dvh;
  }
  #bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .float-heart{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:1;will-change:transform;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 18px rgba(255,80,160,.6)}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0) scale(var(--s));opacity:0}
    10%{opacity:1}
    50%{transform:translateY(-55vh) translateX(var(--dx)) rotate(20deg) scale(var(--s))}
    100%{transform:translateY(-115vh) translateX(0) rotate(-20deg) scale(var(--s));opacity:0}
  }
  .screen{position:relative;z-index:2;width:100%;max-width:420px;padding:24px;display:none;text-align:center}
  .screen.active{display:block;animation:fadeIn .7s ease}
  @keyframes fadeIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

  /* Login */
  .card{
    background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.5);border-radius:28px;padding:34px 24px;
    box-shadow:0 20px 50px rgba(160,20,70,.35);
  }
  .big-heart{font-size:64px;display:inline-block;animation:beat 1.1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  h1{font-family:'Great Vibes',cursive;font-size:58px;font-weight:400;margin:6px 0 4px;text-shadow:0 3px 10px rgba(150,0,60,.4)}
  .sub{font-size:15px;opacity:.95;margin-bottom:24px}
  input{
    width:100%;padding:16px 18px;border-radius:18px;border:2px solid #fff;outline:none;
    font-size:19px;font-weight:600;font-family:inherit;text-align:center;color:#c2185b;background:#fff;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.08);
  }
  input::placeholder{font-weight:500;opacity:.75}
  input:focus{border-color:#ff2e74;box-shadow:0 0 0 4px rgba(255,255,255,.45)}
  button{
    margin-top:16px;width:100%;padding:16px;border:none;border-radius:18px;cursor:pointer;
    font-size:19px;font-weight:700;font-family:inherit;color:#fff;letter-spacing:.3px;
    background:linear-gradient(135deg,#ff2e74,#c2185b);box-shadow:0 10px 25px rgba(194,24,91,.45);
    transition:transform .15s;
  }
  button:active{transform:scale(.96)}
  .error{min-height:22px;margin-top:10px;font-size:14px;color:#fff;font-weight:600}
  .shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

  /* Susan */
  .hello{font-size:18px;margin-bottom:10px;opacity:.95}
  .ring{position:relative;width:300px;height:300px;margin:0 auto;max-width:82vw;max-height:82vw}
  .orbit{position:absolute;inset:0;animation:spin 14s linear infinite}
  .orbit.rev{animation-direction:reverse;animation-duration:20s;inset:30px}
  .orbit span{position:absolute;left:50%;top:50%;font-size:26px;transform-origin:0 0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .name-btn{
    position:absolute;inset:0;margin:auto;width:62%;height:62%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:radial-gradient(circle,#fff 0%,#ffe1ec 70%);color:#e0457b;
    box-shadow:0 0 0 8px rgba(255,255,255,.35),0 15px 40px rgba(160,20,70,.45);
    font-family:'Great Vibes',cursive;font-weight:400;font-size:56px;animation:beat 1.4s infinite;border:none;
  }
  .hint{margin-top:28px;font-size:26px;font-weight:600;text-shadow:0 2px 8px rgba(150,0,60,.4);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.4}}

  /* Mensaje */
  #message .line{font-family:'Great Vibes',cursive;font-weight:400;text-shadow:0 4px 14px rgba(150,0,60,.5);line-height:1.2}
  #message .l1{font-size:72px}
  #message .l2{font-size:56px}
  #message .l3{font-size:40px;margin-top:10px}
  #message .l4{font-size:44px;margin-top:6px}
  .ch{display:inline-block;opacity:0;transform:translateY(30px) scale(.4) rotate(-15deg);animation:pop .55s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  .glow{animation:glow 2s ease-in-out infinite alternate}
  @keyframes glow{from{text-shadow:0 0 8px #fff,0 0 18px #ff6fa3}to{text-shadow:0 0 18px #fff,0 0 40px #ff2e74,0 0 60px #ff2e74}}
  .again{margin-top:30px;width:auto;padding:12px 26px;font-size:15px;opacity:0;animation:fadeIn .6s forwards;animation-delay:5.5s}

  .burst{position:fixed;z-index:5;pointer-events:none;font-size:24px;will-change:transform,opacity;animation:burst 1.6s ease-out forwards;text-shadow:0 0 10px rgba(255,255,255,.95),0 0 20px rgba(255,90,170,.7)}
  @keyframes burst{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
    100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--sc)) rotate(var(--r));opacity:0}
  }
  .music{position:fixed;top:14px;right:14px;z-index:10;width:48px;height:48px;margin:0;padding:0;border-radius:50%;font-size:22px;background:rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(160,20,70,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .music.playing{animation:beat 1.2s infinite}
  #gifts{max-width:480px;padding:18px 0}
  #gifts h2{font-family:'Great Vibes',cursive;font-size:40px;font-weight:400;margin:0 20px 6px;text-shadow:0 3px 10px rgba(150,0,60,.4)}
  #gifts .sub{margin:0 20px 10px}
  .carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:14px;padding:10px 12%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .dots-nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 16px;margin-top:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:transform .2s,background .2s}
  .dot.on{background:#fff;transform:scale(1.35)}
  .finish{margin-top:14px;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 10px 25px rgba(18,140,126,.45)}
  #giftsErr{margin-top:10px;min-height:20px}
  .carousel::-webkit-scrollbar{display:none}
  .slide{flex:0 0 76%;scroll-snap-align:center;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55);border-radius:26px;padding:24px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(160,20,70,.3);display:flex;flex-direction:column;align-items:center;min-height:340px;transition:transform .3s,background .3s}
  .slide .food{font-size:96px;line-height:1.1;margin-top:6px}
  .slide .tag{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;background:rgba(255,255,255,.35);padding:4px 12px;border-radius:20px;margin-top:12px}
  .slide h3{font-size:24px;margin:10px 0 14px}
  .slide .pick{margin-top:auto;background:#fff;color:#c2185b;font-size:17px;padding:13px}
  .slide.selected{background:rgba(255,255,255,.45);border-color:#fff;transform:scale(1.03)}
  .slide.selected .pick{background:linear-gradient(135deg,#ff2e74,#c2185b);color:#fff}
  .slide.final h3{font-family:'Great Vibes',cursive;font-size:40px;font-weight:400;margin:4px 0 8px}
  .summary{list-style:none;font-size:17px;margin:4px 0 12px;max-height:150px;overflow-y:auto;width:100%}
  .summary li{padding:3px 0}
  .send{color:#fff!important;font-size:16px!important;white-space:nowrap;background:linear-gradient(135deg,#25d366,#128c7e)!important;box-shadow:0 10px 25px rgba(18,140,126,.45)!important}
  .nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
  .nav button{width:48px;height:48px;margin:0;padding:0;border-radius:50%;font-size:24px;line-height:1}
  .count{font-size:16px;font-weight:600;min-width:120px}
  /* Perro que juzga */
  .judge{width:170px;height:170px;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 12px 30px rgba(160,20,70,.45);animation:judgeBob 2.2s ease-in-out infinite}
  @keyframes judgeBob{50%{transform:translateY(-6px) rotate(-2deg)}}
  .judge-title{font-size:46px}
  .date-pick{display:flex;gap:10px}
  .date-pick select{
    flex:1;padding:16px 12px;border-radius:18px;border:2px solid #fff;outline:none;
    font-size:18px;font-weight:600;font-family:inherit;text-align:center;color:#c2185b;background:#fff;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.08);
  }
  .date-pick select:focus{border-color:#ff2e74;box-shadow:0 0 0 4px rgba(255,255,255,.45)}

  /* Verificando: el perro se acerca */
  .judge-zoom{width:min(72vw,340px);border-radius:26px;box-shadow:0 24px 70px rgba(120,0,50,.55);animation:approach 5s cubic-bezier(.25,.5,.35,1) forwards}
  @keyframes approach{0%{transform:scale(.3)}45%{transform:scale(1)}100%{transform:scale(2.7)}}
  .loading-text{margin-top:26px;font-size:22px;font-weight:700;text-shadow:0 2px 8px rgba(150,0,60,.4)}
  .dots::after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(1) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  /* Perro que aprueba */
  .good-dog{width:min(58vw,240px);filter:drop-shadow(0 18px 34px rgba(120,0,50,.45));animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  .ok-title{font-size:64px}
  .ok-sub{font-size:17px}

  @media (max-height:640px){
    .ring{width:240px;height:240px}
    .name-btn{font-size:48px}
    #message .l1{font-size:60px}#message .l2{font-size:48px}#message .l3{font-size:38px}#message .l4{font-size:42px}
  }
</style>
</head>
<body>
<div id="bg"></div>
<audio id="music" src="musica.m4a" loop preload="auto" playsinline></audio>
<button class="music" id="musicBtn" aria-label="Música">🔇</button>

<!-- Inicio de sesión -->
<section id="login" class="screen active">
  <div class="card" id="card">
    <div id="stepName">
      <div class="big-heart">💖</div>
      <h1>Para mi amor</h1>
      <p class="sub">Inicia sesión, mi amor</p>
      <form id="form" autocomplete="off">
        <input id="name" type="text" placeholder="Escribe tu nombre" maxlength="30" aria-label="Tu nombre">
        <button type="submit">Entrar 💕</button>
      </form>
    </div>
    <div id="stepDate" style="display:none">
      <img class="judge" src="perro-juzga.jpg" alt="Un perro juzgándote">
      <h1 class="judge-title">A ver...</h1>
      <p class="sub">¿Cuál es la fecha de nuestro aniversario? 🧐</p>
      <form id="formDate" autocomplete="off">
        <div class="date-pick">
          <select id="month" aria-label="Mes">
            <option value="">Mes</option>
            <option value="01">Enero</option><option value="02">Febrero</option>
            <option value="03">Marzo</option><option value="04">Abril</option>
            <option value="05">Mayo</option><option value="06">Junio</option>
            <option value="07">Julio</option><option value="08">Agosto</option>
            <option value="09">Septiembre</option><option value="10">Octubre</option>
            <option value="11">Noviembre</option><option value="12">Diciembre</option>
          </select>
          <select id="day" aria-label="Día"><option value="">Día</option></select>
        </div>
        <button type="submit">Comprobar 💕</button>
      </form>
    </div>
    <div class="error" id="error"></div>
  </div>
</section>

<!-- El perro verificando -->
<section id="checking" class="screen">
  <img class="judge-zoom" src="perro-juzga.jpg" alt="El perro se acerca juzgándote">
  <p class="loading-text">Cargando<span class="dots"></span></p>
</section>

<!-- El perro que aprueba -->
<section id="approved" class="screen">
  <img class="good-dog" src="perro-bien.png" alt="Perro feliz aprobándote">
  <h1 class="ok-title">¡Muy bien!</h1>
  <p class="sub ok-sub">Ya puedes pasar, mi amor 💖</p>
</section>

<!-- Susan rodeada de corazones -->
<section id="susan" class="screen">
  <div class="ring">
    <div class="orbit" id="orbit1"></div>
    <div class="orbit rev" id="orbit2"></div>
    <button class="name-btn" id="susanBtn" aria-label="Susan">Susan</button>
  </div>
  <p class="hint">👆 Toca a Susan 👆</p>
</section>

<!-- Mensaje animado -->
<section id="message" class="screen">
  <div class="line l1 glow" data-text="Susan"></div>
  <div class="line l2" data-text="susantísimo"></div>
  <div class="line l3" data-text="¡qué linda tú estás"></div>
  <div class="line l4 glow" data-text="wow qué bella mi Doctora hermosa 💖"></div>
  <button class="again" id="toGifts">Tengo un regalo para ti 🎁</button>
</section>

<!-- Carrusel de antojos -->
<section id="gifts" class="screen">
  <h2>¿Qué antojo quieres que te regale?</h2>
  <p class="sub">Desliza y toca "Lo quiero" en todo lo que se te antoje 💕</p>
  <div class="carousel" id="carousel"></div>
  <div class="dots-nav" id="dots"></div>
  <div class="nav">
    <button id="prev" aria-label="Anterior">‹</button>
    <span class="count" id="count">0 elegidos</span>
    <button id="next" aria-label="Siguiente">›</button>
  </div>
  <button class="finish" id="finishBtn">Terminar y enviar 💌</button>
  <div class="error" id="giftsErr"></div>
</section>

<script>
  const hearts = ['❤️','💖','💗','💕','💘','💞','💓','💝'];
  const colorHearts = ['❤️','🧡','💛','💚','💙','💜','🤍','💖','💗','💘','💝','💞'];
  const rand = (a,b)=>Math.random()*(b-a)+a;
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  const music=document.getElementById('music'), musicBtn=document.getElementById('musicBtn');
  let userMuted=false;
  music.addEventListener('play',()=>{musicBtn.textContent='🎵';musicBtn.classList.add('playing')});
  music.addEventListener('pause',()=>{musicBtn.textContent='🔇';musicBtn.classList.remove('playing')});
  function startMusic(e){ if(e && e.target===musicBtn) return; if(!userMuted && music.paused) music.play().catch(()=>{}); }
  startMusic();
  ['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,startMusic,{passive:true}));
  musicBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(music.paused){userMuted=false;music.play().catch(()=>{});}
    else{userMuted=true;music.pause();}
  });

  // Corazones flotando de fondo
  const bg = document.getElementById('bg');
  function floatHeart(){
    const h = document.createElement('span');
    h.className='float-heart';
    h.textContent=pick(colorHearts);
    h.style.left=rand(0,100)+'vw';
    h.style.fontSize=rand(16,38)+'px';
    h.style.setProperty('--s',rand(.7,1.3));
    h.style.setProperty('--dx',rand(-40,40)+'px');
    const d=rand(6,12);
    h.style.animationDuration=d+'s';
    bg.appendChild(h);
    setTimeout(()=>h.remove(),d*1000);
  }
  for(let i=0;i<14;i++) setTimeout(floatHeart,i*250);
  setInterval(floatHeart,260);
  setInterval(()=>{ if(!document.hidden) burst(rand(innerWidth*.1,innerWidth*.9),rand(innerHeight*.1,innerHeight*.8),14); },2200);
  document.addEventListener('pointerdown',e=>{ if(!e.target.closest('button,input')) burst(e.clientX,e.clientY,18); },{passive:true});

  // Corazones alrededor de Susan
  function fillOrbit(el,count,radius){
    for(let i=0;i<count;i++){
      const s=document.createElement('span');
      const ang=(360/count)*i;
      s.textContent=hearts[i%hearts.length];
      s.style.transform=`rotate(${ang}deg) translate(${radius}) rotate(-${ang}deg) translate(-50%,-50%)`;
      el.appendChild(s);
    }
  }
  fillOrbit(document.getElementById('orbit1'),14,'min(150px, 41vw)');
  fillOrbit(document.getElementById('orbit2'),10,'min(118px, 33vw)');

  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function burst(x,y,n=40){
    for(let i=0;i<n;i++){
      const b=document.createElement('span');
      b.className='burst';
      b.textContent=pick(colorHearts);
      b.style.left=x+'px'; b.style.top=y+'px';
      const ang=rand(0,Math.PI*2), dist=rand(80,Math.max(innerWidth,innerHeight)*.6);
      b.style.setProperty('--x',Math.cos(ang)*dist+'px');
      b.style.setProperty('--y',Math.sin(ang)*dist+'px');
      b.style.setProperty('--sc',rand(.8,2));
      b.style.setProperty('--r',rand(-180,180)+'deg');
      b.style.fontSize=rand(20,44)+'px';
      document.body.appendChild(b);
      setTimeout(()=>b.remove(),1700);
    }
  }

  const form=document.getElementById('form'), input=document.getElementById('name'), err=document.getElementById('error');
  const card=document.getElementById('card');
  function shakeCard(){card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');}
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const name=input.value.trim();
    if(!name){
      err.textContent='Escribe tu nombre, hermosa 💕';
      shakeCard();
      return;
    }
    input.blur();
    err.textContent='';
    document.getElementById('stepName').style.display='none';
    document.getElementById('stepDate').style.display='block';
  });

  // Validación del aniversario: el perro juzga 5s y luego aprueba
  // La fecha correcta (MM-DD) vive en aniversario.txt en este mismo repo
  const formDate=document.getElementById('formDate');
  const monthSel=document.getElementById('month'), daySel=document.getElementById('day');
  for(let d=1;d<=31;d++){
    const o=document.createElement('option');
    o.value=String(d).padStart(2,'0'); o.textContent=d;
    daySel.appendChild(o);
  }
  async function getAnniversary(){
    try{
      const t=(await (await fetch('aniversario.txt',{cache:'no-store'})).text()).trim();
      return /^\d{2}-\d{2}$/.test(t)?t:'';
    }catch(e){return '';}
  }
  formDate.addEventListener('submit',e=>{
    e.preventDefault();
    if(!monthSel.value||!daySel.value){
      err.textContent='Elige el mes y el día, mi amor 🥺';
      shakeCard();
      return;
    }
    err.textContent='';
    show('checking');
    const chosen=monthSel.value+'-'+daySel.value;
    Promise.all([getAnniversary(),new Promise(r=>setTimeout(r,5000))]).then(([anniv])=>{
      if(!anniv || chosen===anniv){
        burst(innerWidth/2,innerHeight/2,70);
        show('approved');
        setTimeout(()=>show('susan'),3800);
      }else{
        show('login');
        err.textContent='Esa no es 😤 el perro te sigue juzgando';
        shakeCard();
      }
    });
  });

  function typeMessage(){
    let delay=0;
    document.querySelectorAll('#message .line').forEach(line=>{
      line.innerHTML='';
      [...line.dataset.text].forEach(ch=>{
        const s=document.createElement('span');
        s.className='ch';
        s.innerHTML=ch===' '?'&nbsp;':ch;
        s.style.animationDelay=delay+'s';
        line.appendChild(s);
        delay+=0.07;
      });
      delay+=0.25;
    });
    const again=document.getElementById('toGifts');
    again.style.animation='none'; void again.offsetWidth; again.style.animation='';
  }

  let rain;
  document.getElementById('susanBtn').addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,140);
    setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,80),250);
    if(navigator.vibrate) navigator.vibrate([80,60,80]);
    setTimeout(()=>{
      show('message');
      typeMessage();
      clearInterval(rain);
      rain=setInterval(()=>burst(rand(0,innerWidth),rand(0,innerHeight*.7),18),450);
      setTimeout(()=>clearInterval(rain),10000);
    },500);
  });

  document.getElementById('toGifts').addEventListener('click',()=>{
    clearInterval(rain);
    show('gifts');
    carousel.scrollLeft=0;
  });

  // Carrusel de antojos
  const WHATSAPP='18495851396';
  const foods=[
    ['🍫','Chocolates','Dulce'],['🍓','Fresas con chocolate','Dulce'],['🍦','Helado','Dulce'],
    ['🎂','Pastel','Dulce'],['🍩','Donas','Dulce'],['🧁','Cupcakes','Dulce'],
    ['🍪','Galletas','Dulce'],['🍮','Flan','Dulce'],['🍰','Tres leches','Dulce'],['🍬','Caramelos','Dulce'],
    ['🍕','Pizza','Salada'],['🍣','Sushi','Salada'],['🍔','Hamburguesa','Salada'],
    ['🌮','Tacos','Salada'],['🍟','Papas fritas','Salada'],['🍗','Pollo frito','Salada'],
    ['🍝','Pasta','Salada'],['🥟','Empanadas','Salada'],['🌭','Hot dog','Salada'],['🍿','Palomitas','Salada']
  ];
  const chosen=new Set();
  const carousel=document.getElementById('carousel'), count=document.getElementById('count');
  foods.forEach(([e,n,t],i)=>{
    const d=document.createElement('div');
    d.className='slide';
    d.innerHTML=`<div class="food">${e}</div><span class="tag">${t==='Dulce'?'🍬 Dulce':'🧂 Salada'}</span><h3>${n}</h3><button class="pick">Lo quiero 💖</button>`;
    d.querySelector('.pick').addEventListener('click',ev=>{
      if(chosen.has(i)){chosen.delete(i);d.classList.remove('selected');ev.target.textContent='Lo quiero 💖';}
      else{
        chosen.add(i);d.classList.add('selected');ev.target.textContent='¡Elegido! ✅';
        const r=ev.target.getBoundingClientRect();burst(r.left+r.width/2,r.top,30);
        const nx=carousel.children[i+1];
        if(nx) setTimeout(()=>carousel.scrollTo({left:nx.offsetLeft-(carousel.clientWidth-nx.offsetWidth)/2,behavior:'smooth'}),450);
      }
      updateSummary();
    });
    carousel.appendChild(d);
  });
  const final=document.createElement('div');
  final.className='slide final';
  final.innerHTML=`<div class="food" style="font-size:64px">💌</div><h3>Tus antojos</h3><ul class="summary" id="summary"></ul><button class="pick send" id="send">Enviar a mi amor 💌</button>`;
  carousel.appendChild(final);
  const summary=final.querySelector('#summary');
  const giftsErr=document.getElementById('giftsErr'), finishBtn=document.getElementById('finishBtn');
  function updateSummary(){
    const items=[...chosen].sort((a,b)=>a-b).map(i=>foods[i]);
    count.textContent=items.length===1?'1 elegido':items.length+' elegidos';
    if(items.length) giftsErr.textContent='';
    summary.innerHTML=items.length?items.map(([e,n])=>`<li>${e} ${n}</li>`).join(''):'<li>Todavía no elegiste nada 🥺<br>Desliza hacia atrás y elige tus antojos</li>';
  }
  updateSummary();
  function sendGifts(){
    if(!chosen.size){
      giftsErr.textContent='Elige al menos un antojo primero 🥺';
      finishBtn.classList.remove('shake'); void finishBtn.offsetWidth; finishBtn.classList.add('shake');
      return;
    }
    const list=[...chosen].sort((a,b)=>a-b).map(i=>`• ${foods[i][0]} ${foods[i][1]}`).join('\n');
    const msg=`Mi amor 💖, quiero que me regales:
${list}

Con amor, tu Susan 😘`;
    window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP}&text=${encodeURIComponent(msg)}`,'_blank');
  }
  final.querySelector('#send').addEventListener('click',sendGifts);
  finishBtn.addEventListener('click',sendGifts);

  // Puntitos indicadores del carrusel
  const dotsNav=document.getElementById('dots');
  [...carousel.children].forEach(s=>{
    const d=document.createElement('span');
    d.className='dot';
    d.addEventListener('click',()=>carousel.scrollTo({left:s.offsetLeft-(carousel.clientWidth-s.offsetWidth)/2,behavior:'smooth'}));
    dotsNav.appendChild(d);
  });
  function updateDots(){
    const mid=carousel.scrollLeft+carousel.clientWidth/2;
    let best=0,bd=1e9;
    [...carousel.children].forEach((s,i)=>{const d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid);if(d<bd){bd=d;best=i;}});
    [...dotsNav.children].forEach((d,i)=>d.classList.toggle('on',i===best));
  }
  carousel.addEventListener('scroll',updateDots,{passive:true});
  updateDots();
  const step=()=>carousel.querySelector('.slide').offsetWidth+14;
  document.getElementById('prev').addEventListener('click',()=>carousel.scrollBy({left:-step(),behavior:'smooth'}));
  document.getElementById('next').addEventListener('click',()=>carousel.scrollBy({left:step(),behavior:'smooth'}));
</script>
</body>
</html>
